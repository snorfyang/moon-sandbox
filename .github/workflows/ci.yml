name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MoonBit
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - name: Add MoonBit to PATH
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Format warning (MoonBit backend compatibility)
        run: moon fmt --warn
      - name: Check
        run: moon check --deny-warn
      - name: Test
        run: moon test --deny-warn
      - name: Build
        run: moon build --target native
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned integration runner
        run: python -m pip install uv==0.8.17
      - name: Install locked MCP and WASI dependencies
        run: uv sync --frozen --project adapters/mcp_wasi --python 3.12
      - name: Real MCP to WASI integration
        run: adapters/mcp_wasi/.venv/bin/python -m unittest discover -s tests/integration -v
      - name: Upload WASI execution evidence
        uses: actions/upload-artifact@v4
        with:
          name: mcp-wasi-evidence
          path: _build/mcp-wasi-evidence.json
          if-no-files-found: error
